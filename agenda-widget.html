<!DOCTYPE html>
<html lang="nl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Agenda HV Novitas"
  >

  <title>
    Agenda HV Novitas
  </title>


  <!-- =====================================================
       AGENDA CSS
       ===================================================== -->

  <link
    rel="stylesheet"
    href="./agenda-widget.css?v=20260926-8"
  >

</head>


<body>


  <!-- =====================================================
       AGENDA WIDGET
       ===================================================== -->

  <main
    class="agenda-widget"
    aria-label="Agenda HV Novitas"
  >


    <!-- ===================================================
         HEADER
         =================================================== -->

    <header
      class="agenda-header"
    >


      <div
        class="agenda-header-icon"
      >

        <span
          class="calendar-icon"
          aria-hidden="true"
        >

          <span
            class="calendar-top"
          ></span>


          <span
            class="calendar-grid"
          >

            <i></i>
            <i></i>
            <i></i>

            <i></i>
            <i></i>
            <i></i>

            <i></i>
            <i></i>
            <i></i>

          </span>

        </span>

      </div>



      <div
        class="agenda-header-text"
      >

        <div
          class="agenda-kicker"
        >
          HV NOVITAS
        </div>


        <h1>
          AGENDA
        </h1>


        <p>
          De komende 14 dagen
        </p>

      </div>


    </header>



    <!-- ===================================================
         STATUS
         =================================================== -->

    <div
      id="agendaStatus"
      class="agenda-status"
    >
      Agenda laden...
    </div>



    <!-- ===================================================
         AGENDA LIJST
         =================================================== -->

    <div
      id="agendaList"
      class="agenda-list"
    ></div>



    <!-- ===================================================
         FOOTER
         =================================================== -->

    <footer
      class="agenda-footer"
    >

      <span>
        Handbalclub Hulst – Zeeuws-Vlaanderen
      </span>


      <a
        href="https://calendar.google.com/calendar/embed?src=hvnovitas%40gmail.com&ctz=Europe%2FAmsterdam&mode=AGENDA"
        target="_blank"
        rel="noopener noreferrer"
      >
        Naar volledige agenda →
      </a>

    </footer>


  </main>



  <!-- =====================================================
       AGENDA JAVASCRIPT
       ===================================================== -->

  <script
    type="module"
    src="./agenda-widget.js?v=20260926-8">
  </script>


</body>

</html>
